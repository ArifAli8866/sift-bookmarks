<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sift — Your personal developer library</title>
  <desc id="desc">A dark, violet-gradient banner with the Sift name, tagline, and a preview of an organized developer-resource library.</desc>
  <defs>
    <linearGradient id="bg" x1="84" y1="26" x2="1370" y2="473" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101326"/>
      <stop offset="0.54" stop-color="#191632"/>
      <stop offset="1" stop-color="#102439"/>
    </linearGradient>
    <linearGradient id="glow" x1="1010" y1="10" x2="1290" y2="437" gradientUnits="userSpaceOnUse">
